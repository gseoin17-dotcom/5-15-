<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 밀실 방탈출 탐색기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #090d16; color: #fff; font-family: sans-serif; }
        #canvas-container {
            width: 100%;
            height: 450px;
            position: relative;
            background-color: #000;
        }
        #room-3d-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
            display: block;
        }
        #room-3d-canvas:active { cursor: grabbing; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto space-y-4">
        <!-- 상단 헤더 -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">3D 밀실 탐색 & 방탈출</h1>
                <p class="text-xs text-slate-400">마우스 드래그: 시점 회전 | 물체 클릭: 단서 조사 및 파괴</p>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400">현재 보유 위력</span>
                <div id="player-power" class="text-lg font-bold text-amber-400">150 WP</div>
            </div>
        </div>

        <!-- 3D 캔버스 영역 -->
        <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
            <div id="canvas-container">
                <canvas id="room-3d-canvas"></canvas>
                <div class="absolute top-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded text-xs border border-white/10">
                    STATUS: <span text-emerald-400 font-bold>3D ENGINE ONLINE</span>
                </div>
            </div>

            <!-- 하단 인터랙션 컨트롤러 -->
            <div class="p-4 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-950">
                <div>
                    <h3 id="target-name" class="font-bold text-emerald-400">오브젝트를 선택하세요</h3>
                    <p id="target-desc" class="text-xs text-slate-400 mt-1">방 안에서 빛나는 3D 도형을 클릭하면 조사가 시작됩니다.</p>
                </div>
                <button id="btn-action" disabled class="w-full sm:w-auto px-6 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed">
                    오브젝트 파괴 / 해제
                </button>
            </div>
        </div>

        <!-- 로그 출력 창 -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h4 class="text-xs font-bold text-slate-400 mb-2">탐색 실시간 로그</h4>
            <div id="log-box" class="text-xs font-mono text-slate-300 space-y-1 h-24 overflow-y-auto bg-slate-950 p-2 rounded">
                <p class="text-slate-500">> SYSTEM: 3D 방탈출 공간 로딩이 완료되었습니다.</p>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let interactiveMeshes = [];
        let selectedMesh = null;
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };
        const playerPower = 150;

        // 3D 방 안의 오브젝트 데이터
        const roomObjects = [
            { id: 'vent', name: '붉은 봉인 환기구', powerReq: 50, shape: 'box', size: [1.5, 1.5, 0.3], pos: [0, 1.5, -4.8], color: 0xef4444 },
            { id: 'turret', name: '청색 자동 방어포', powerReq: 120, shape: 'cylinder', size: [0.5, 0.5, 1.5, 16], pos: [-3, -0.5, -3], color: 0x3b82f6 },
            { id: 'lock', name: '황색 전자 자물쇠', powerReq: 200, shape: 'box', size: [0.8, 1.2, 0.3], pos: [3, 0, -3.5], color: 0xeab308 },
            { id: 'door', name: '보랏빛 탈출 강철문', powerReq: 300, shape: 'box', size: [2.5, 4, 0.3], pos: [0, -0.5, -4.9], color: 0xa855f7 }
        ];

        function init() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('room-3d-canvas');

            // 1. Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 0, 3);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);

            // 3. Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x10b981, 1.5, 20);
            pointLight.position.set(0, 2, 2);
            scene.add(pointLight);

            // 4. Room Wireframe (벽면 표현)
            const roomGeo = new THREE.BoxGeometry(10, 7, 10);
            const roomMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true });
            const roomMesh = new THREE.Mesh(roomGeo, roomMat);
            scene.add(roomMesh);

            // 5. 3D Interactive Objects 생성
            roomObjects.forEach(data => {
                let geo;
                if (data.shape === 'box') geo = new THREE.BoxGeometry(...data.size);
                else if (data.shape === 'cylinder') geo = new THREE.CylinderGeometry(...data.size);

                const mat = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.3,
                    metalness: 0.5,
                    emissive: data.color,
                    emissiveIntensity: 0.3
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...data.pos);
                mesh.userData = { ...data, cleared: false };

                scene.add(mesh);
                interactiveMeshes.push(mesh);
            });

            // 마우스 이벤트: 회전 (Drag)
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                prevMousePos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => isDragging = false);

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - prevMousePos.x;
                const deltaY = e.clientY - prevMousePos.y;

                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camera.rotation.x));

                prevMousePos = { x: e.clientX, y: e.clientY };
            });

            // 마우스 이벤트: 오브젝트 클릭 선택 (Raycasting)
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
                const y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(x, y), camera);

                const intersects = raycaster.intersectObjects(interactiveMeshes);
                if (intersects.length > 0) {
                    selectObject(intersects[0].object);
                }
            });

            // 리사이즈 처리
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            // 애니메이션 루프
            function render() {
                requestAnimationFrame(render);
                interactiveMeshes.forEach(m => {
                    if (!m.userData.cleared) m.rotation.y += 0.01;
                });
                renderer.render(scene, camera);
            }
            render();
        }

        function selectObject(mesh) {
            selectedMesh = mesh;
            const data = mesh.userData;

            document.getElementById('target-name').innerText = data.name;
            document.getElementById('target-desc').innerText = `필요 악취 위력: ${data.powerReq} WP | 상태: ${data.cleared ? '파괴됨' : '작동 중'}`;
            document.getElementById('btn-action').disabled = data.cleared;

            addLog(`3D 오브젝트 선택: [${data.name}] (요구 위력: ${data.powerReq})`);
        }

        document.getElementById('btn-action').onclick = () => {
            if (!selectedMesh) return;
            const data = selectedMesh.userData;

            if (playerPower >= data.powerReq) {
                data.cleared = true;
                selectedMesh.material.color.setHex(0x475569);
                selectedMesh.material.emissive.setHex(0x000000);
                
                addLog(`[성공] ${data.name}을(를) 파괴했습니다!`);
                alert(`${data.name} 파괴 성공!`);
                document.getElementById('btn-action').disabled = true;
            } else {
                addLog(`[실패] 위력이 부족합니다. (현재: ${playerPower} / 필요: ${data.powerReq})`);
                alert('위력이 부족합니다!');
            }
        };

        function addLog(msg) {
            const box = document.getElementById('log-box');
            const p = document.createElement('p');
            p.innerText = `> ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }

        window.onload = init;
    </script>
</body>
</html>
