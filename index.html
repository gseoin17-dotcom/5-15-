<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GZ ROLE VOTE</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">gz</div>
      <div>
        <div class="brand-title">ROLE VOTE</div>
        <div class="brand-sub">GZ MEMBER SYSTEM</div>
      </div>
    </div>
    <div id="userArea"></div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">GZ MEMBER VOTE</p>
      <h1>멤버 역할을<br><span>투표로 결정합니다.</span></h1>
      <p class="desc">각 멤버에게 가장 어울리는 역할 하나를 선택하세요. 투표는 종료 전까지 변경할 수 있습니다.</p>

      <div class="role-guide">
        <span class="c-temp">임시 멤버</span>
        <span class="c-amb">애매한 멤버</span>
        <span class="c-settle">정착 멤버</span>
        <span class="c-official">정식 멤버</span>
      </div>

      <div class="timer-box">
        <div>
          <p class="timer-label">투표 종료까지 남은 시간</p>
          <div id="timer" class="timer">--시간 --분 --초</div>
        </div>
        <div id="timerStatus" class="timer-status">확인 중</div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <p class="eyebrow">MEMBERS</p>
          <h2>역할 투표</h2>
        </div>
        <button id="resetBtn" class="ghost danger hidden">전체 초기화 + 25시간 재시작</button>
      </div>

      <div id="loginNotice" class="notice hidden">
        투표하려면 GZ 서버에 들어와 있는 Discord 계정으로 로그인하세요.
        <a href="/auth/discord">Discord로 로그인</a>
      </div>

      <div id="cards" class="grid"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
