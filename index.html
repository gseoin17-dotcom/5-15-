<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지온냄새 강화하기</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script></head><body><div id="app"><header><div><div class="eyebrow">🌌 JION SMELL ENHANCEMENT</div><h1>지온냄새 강화하기</h1><div id="titleBadge" class="title-badge">🏷️ 칭호 없음</div></div><div class="season-switch"><button id="s1Btn">시즌 1</button><button id="s2Btn">시즌 2</button></div></header><main><section class="left"><div class="stats"><div><span>💳 보유 금액</span><b id="money">0원</b></div><div><span>⭐ 포인트</span><b id="points">0P</b></div><div><span>💧 눈물</span><b id="tears">0 / 60</b></div><div><span>✨ 지온이의 가오</span><b id="pity">실패까지 4회</b></div><div><span>🛡️ 방지권</span><b id="shield">0 / 3</b></div><div><span>🏆 강화 시도</span><b id="attempts">0회</b></div></div><div class="game-card"><div class="mode" id="mode">시즌 1 · 기본 강화</div><div class="level" id="level">0강</div><div class="name" id="name">무취</div><p id="desc">-</p><div class="bar"><i id="progress"></i></div><div class="costrow"><span>다음 강화 비용 <b id="cost">0원</b></span><span>성공 보상 <b id="reward">0P</b></span></div><div id="status" class="status ready">강화 준비 완료</div><div class="actions"><button id="enhance" class="primary">🔥 강화하기</button><button id="sell" class="secondary">💰 판매하기</button></div><div class="menu"><button data-modal="shop">🛒 상점</button><button data-modal="tearsModal">💧 눈물</button><button data-modal="achievements">🏆 업적</button><button data-modal="titles">🏷️ 칭호</button></div></div></section><section class="right"><div id="scene"><canvas id="three"></canvas><div id="sceneText"><div id="sceneStatus">READY</div><div id="sceneName">0단계</div></div></div></section></main></div><div id="toast"></div><div id="modal" class="modal"><div class="modal-box"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div><script src="game.js"></script></body></html>
